name: fetch-usdt-toman

# No `schedule:` trigger here on purpose — GitHub Actions cron is imprecise
# and unreliable for hourly jobs on public repos. Instead, a Cloudflare
# Worker on a Cron Trigger calls the `workflow_dispatch` API below on a
# reliable hourly schedule. See ../../wrangler.toml and ../../src/index.js.
on:
  workflow_dispatch: {} # triggered by the Cloudflare Worker, or manually to test

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetch-price.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
